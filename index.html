<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ant Wars</title>
<meta name="description" content="Ant Wars – baue deine Ameisenkolonie und erobere die Welt.">
<meta name="theme-color" content="#0a0e16">
<link rel="icon" type="image/png" href="img/icon.png">
<link rel="stylesheet" href="css/ui.css?v=21.14">
</head>
<body>
<div id="loader" role="status" aria-live="polite">
  <div class="ldbox">
    <img class="ldlogo" src="img/logo.png" alt="Ant Wars">
    <div class="ldtrack">
      <i class="ldline"></i>
      <svg class="ldant a1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="2.5" ry="2.7"/><ellipse cx="12" cy="12.5" rx="2" ry="2.5"/><ellipse cx="12" cy="19" rx="3" ry="3"/><path d="M5 9l5 2M19 9l-5 2M4 15l6-2M20 15l-6-2M6 21l4-3M18 21l-4-3M10 4L7 2M14 4l3-2"/></svg>
      <svg class="ldant a2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="2.5" ry="2.7"/><ellipse cx="12" cy="12.5" rx="2" ry="2.5"/><ellipse cx="12" cy="19" rx="3" ry="3"/><path d="M5 9l5 2M19 9l-5 2M4 15l6-2M20 15l-6-2M6 21l4-3M18 21l-4-3M10 4L7 2M14 4l3-2"/></svg>
    </div>
    <div class="ldtxt" id="ldTxt">Ameisen sammeln sich …</div>
  </div>
</div>
<div id="pbar" aria-hidden="true"><i></i></div>
<header id="top">
  <div class="brand"><img src="img/logo.png" alt="Ant Wars" id="logo"><span id="dayLabel"></span></div>
  <div id="potd" hidden></div>
  <div class="row" id="viewtabs" hidden>
    <button class="btn on" id="tabColony" type="button">Kolonie</button>
    <button class="btn" id="tabMap" type="button">Weltkarte</button>
  </div>
  <div class="row" id="speed" hidden style="gap:4px">
    <button class="btn sm" data-sp="0" type="button" aria-label="Pause">II</button>
  </div>
  <div id="hdrR"></div>
</header>
<div id="app">
  <div id="chipwrap">
    <div id="chips" hidden>
      <button class="chip" type="button" data-k="workers"><canvas class="ic" width="12" height="12" data-ic="ant"></canvas><b id="cW">0</b><small id="cWm"></small></button>
      <button class="chip" type="button" data-k="soldiers"><canvas class="ic" width="12" height="12" data-ic="soldier"></canvas><b id="cS">0</b><small id="cSm"></small></button>
      <button class="chip" type="button" data-k="eggs"><canvas class="ic" width="12" height="12" data-ic="egg"></canvas><b id="cE">0</b><small id="cEm"></small></button>
      <button class="chip" id="chipFood" type="button" data-k="food"><canvas class="ic" width="12" height="12" data-ic="leaf"></canvas><b id="cF">0</b><small id="cFm"></small></button>
      <button class="chip" type="button" data-k="fungus"><canvas class="ic" width="12" height="12" data-ic="mush"></canvas><b id="cP">0</b><small id="cPm"></small></button>
      <button class="chip" type="button" data-k="mat"><canvas class="ic" width="12" height="12" data-ic="clay"></canvas><b id="cM">0</b><small id="cMm"></small></button>
      <button class="chip" type="button" data-k="terr"><canvas class="ic" width="12" height="12" data-ic="flag"></canvas><b id="cT">0</b><small id="cTm"></small></button>
      <button class="chip" type="button" data-k="heat"><canvas class="ic" width="12" height="12" data-ic="star"></canvas><b id="cH">0</b><small id="cHm">/5</small></button>
      <div id="pwr"></div>
    </div>
    <div id="statp" hidden></div>
  </div>
  <main>
    <section id="viewColony" hidden>
      <div id="colSwitch"></div>
      <div class="stage"><canvas id="cv" width="1120" height="630"></canvas></div>
      <div id="hint"></div>
      <div class="mini" style="text-align:center;margin-top:2px"><span id="ctlHint"></span></div>
      <div id="dock">
        <div class="tabs" role="tablist">
          <button class="tab on" data-tab="ants" type="button">Ameisen</button>
          <button class="tab" data-tab="rooms" type="button">Räume</button>
          <button class="tab" data-tab="upg" type="button">Upgrades</button>
        </div>
        <div class="cards" id="dockBody"></div>
      </div>
    </section>

    <section id="viewMap">
      <div class="mapwrap">
        <div class="stage"><canvas id="mv" width="960" height="600"></canvas></div>
        <aside id="side">
          <div id="setupPanel">
            <h2>Neue Kolonie</h2>
            <p class="mini" style="margin:4px 0 8px">1. Art wählen, 2. Startgebiet auf der Karte anklicken, 3. losbauen.</p>
            <div id="spcList" style="display:flex;flex-direction:column;gap:6px"></div>
            <dl class="kv" style="margin-top:10px"><dt>Startgebiet</dt><dd id="setupStart">noch keins</dd></dl>
            <div style="margin-top:10px"><div class="mini" style="margin-bottom:4px">Gegner</div>
              <div class="seg" id="diffSeg">
                <button class="btn" data-d="easy" type="button">Leicht</button>
                <button class="btn on" data-d="normal" type="button">Normal</button>
                <button class="btn" data-d="hard" type="button">Schwer</button>
              </div></div>
            <div class="row" style="margin-top:12px">
              <button class="btn" id="btnReroll" type="button">Neue Karte</button>
              <button class="btn primary" id="btnStart" type="button" disabled>Spiel starten</button>
            </div>
          </div>
          <div id="playPanel" hidden>
            <div class="sidetabs"><button class="btn on" id="stInfo" type="button">Karte</button></div>
            <div id="infoBox" style="margin-top:10px">
            <h2>Lage</h2>
            <div class="facs" id="facList" style="margin-top:6px"></div>
            <h2 style="margin-top:14px">Gebiet</h2>
            <p class="mini" id="terrHint" style="margin:4px 0 6px">Klicke ein eigenes Gebiet, dann ein angrenzendes, um Soldaten zu schicken.</p>
            <dl class="kv" id="terrInfo"></dl>
            <div id="sendBox" hidden style="margin-top:8px">
              <div class="mini">Soldaten entsenden: <b id="pctLbl" style="color:var(--gold)">50%</b> (<span id="pctN">0</span>)</div>
              <input type="range" id="pct" min="10" max="100" step="10" value="50" aria-label="Anteil der Truppen">
            </div>
            <h2 style="margin-top:14px">Märsche</h2>
            <div id="marches" class="mini" style="margin-top:4px">keine</div>
            </div>
          </div>
        </aside>
      </div>
    </section>
  </main>
</div>
<aside id="adrail" aria-label="Werbung"><div class="ad" id="adSlot"></div></aside>
<div id="toasts" aria-live="polite"></div>
<div id="tip" hidden></div>
<div id="end" hidden><div class="box"><h2 id="endT"></h2><p id="endP"></p><button class="btn" id="endCont" type="button" hidden>Weiterspielen</button> <button class="btn primary" id="endBtn" type="button">Neue Partie</button></div></div>

<script src="config.js?v=21.14" onerror="void 0"></script>
<script src="js/util.js?v=21.14"></script>
<script src="js/icons.js?v=21.14"></script>
<script src="js/flags.js?v=21.14"></script>
<script src="js/svgart.js?v=21.14"></script>
<script src="js/backend.js?v=21.14"></script>
<script src="js/cosmetics.js?v=21.14"></script>
<script src="js/game-core.js?v=21.14"></script>
<script src="js/game-colony.js?v=21.14"></script>
<script src="js/game-world.js?v=21.14"></script>
<script src="js/game-ui.js?v=21.14"></script>
<script src="js/game-radial.js?v=21.14"></script>
<script src="js/game-sea.js?v=21.14"></script>
<script src="js/game-trade.js?v=21.14"></script>
<script src="js/game-hud.js?v=21.14"></script>
<script src="js/game-pause.js?v=21.14"></script>
<script src="js/game-settings.js?v=21.14"></script>
<script src="js/i18n.js?v=21.14"></script>
<script src="js/i18n-en.js?v=21.14"></script>
<script src="js/ui-core.js?v=21.14"></script>
<script src="js/ui-screens.js?v=21.14"></script>
<script src="js/ui-quests.js?v=21.14"></script>
<script src="js/ui-clan.js?v=21.14"></script>
<script src="js/net.js?v=21.14"></script>
<script src="js/touch.js?v=21.14"></script>
<script src="js/ui-boot.js?v=21.14"></script>
</body>
</html>
